<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#e0eafc] to-[#cfdef3]">
  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    class="backdrop-blur-lg bg-white/50 border border-white/30 shadow-2xl rounded-3xl px-8 py-10 max-w-md w-full flex flex-col gap-8"
    style="border-radius: 32px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);"
    autocomplete="off"
  >
    <h2 class="text-4xl font-bold text-gray-900 mb-4 text-center drop-shadow">Accedi</h2>
    <div class="flex flex-col gap-4">
      <div>
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 bg-white/80 text-gray-900 placeholder-gray-400 transition-all duration-200 outline-none"
          [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-200': loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)}"
          placeholder="Inserisci la tua email"
        />
        <div *ngIf="loginForm.get('email')?.hasError('required') && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="text-red-600 text-xs mt-1">
          Email obbligatoria
        </div>
        <div *ngIf="loginForm.get('email')?.hasError('email') && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="text-red-600 text-xs mt-1">
          Email non valida
        </div>
      </div>
      <div>
        <label for="password" class="block text-gray-700 font-semibold mb-1">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 bg-white/80 text-gray-900 placeholder-gray-400 transition-all duration-200 outline-none"
          [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-200': loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)}"
          placeholder="Inserisci la password"
        />
        <div *ngIf="loginForm.get('password')?.hasError('required') && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="text-red-600 text-xs mt-1">
          Password obbligatoria
        </div>
      </div>
    </div>
    <button type="submit" class="w-full py-2 rounded-xl font-semibold shadow-lg bg-gradient-to-r from-blue-500 to-indigo-500 text-white mt-4 transition-all duration-200 hover:scale-105" [disabled]="loginForm.invalid">
      Accedi
    </button>
    <div *ngIf="error" class="text-red-600 text-sm mt-2 text-center">{{ error }}</div>
    <div class="text-center mt-6">
      <a routerLink="/auth/register" class="text-indigo-700 hover:underline font-semibold">Non hai un account? Registrati</a>
    </div>
  </form>
</div>
