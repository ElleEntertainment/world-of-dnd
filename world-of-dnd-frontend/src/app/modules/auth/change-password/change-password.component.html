<form (ngSubmit)="onSubmit()" class="max-w-md mx-auto mt-8 p-6 bg-white rounded shadow space-y-4">
  <h2 class="text-2xl font-bold mb-4">Cambia Password</h2>
  <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required class="input input-bordered w-full" />
  <input type="password" [(ngModel)]="oldPassword" name="oldPassword" placeholder="Vecchia password" required class="input input-bordered w-full" />
  <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Nuova password" required class="input input-bordered w-full" />
  <button type="submit" class="btn btn-primary w-full">Aggiorna Password</button>
  <div *ngIf="message" class="text-green-600">{{ message }}</div>
  <div *ngIf="error" class="text-red-600">{{ error }}</div>
</form>
