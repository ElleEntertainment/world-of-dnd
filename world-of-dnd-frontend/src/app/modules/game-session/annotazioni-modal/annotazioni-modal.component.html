<div *ngIf="show" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl shadow-2xl border-4 border-yellow-700 max-w-lg w-full p-6 flex flex-col relative">
    <button (click)="close()" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 text-2xl font-bold">&times;</button>
    <h2 class="text-2xl font-bold text-yellow-400 mb-4 text-center">Annotazioni</h2>
    <ckeditor [editor]="Editor" [config]="editorConfig" [(ngModel)]="data" style="min-height:320px;min-width:100%;height:400px;width:100%;"></ckeditor>
    <div class="flex justify-end gap-2 mt-4">
      <button type="button" (click)="close()" class="px-4 py-2 rounded bg-gray-700 text-white hover:bg-gray-600">Chiudi</button>
      <button type="button" (click)="save()" class="px-4 py-2 rounded bg-yellow-700 text-white hover:bg-yellow-600">Salva</button>
    </div>
  </div>
</div>
