<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl shadow-2xl border-4 border-yellow-700 max-w-lg w-full p-6 flex flex-col relative">
    <button (click)="close.emit()" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 text-2xl font-bold">&times;</button>
    <h2 class="text-2xl font-bold text-yellow-400 mb-4 text-center">Inventario</h2>
    <div class="flex flex-col gap-2 mb-4 max-h-64 overflow-y-auto">
      <div *ngFor="let item of items; let i = index" class="flex items-center justify-between bg-gray-800 rounded-lg px-4 py-2 shadow">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-white">{{ item.name }}</span>
          <span class="text-yellow-300 font-bold">x{{ item.quantity }}</span>
        </div>
        <div class="flex gap-2">
          <button (click)="decreaseQuantity(i)" class="px-2 py-1 rounded bg-yellow-700 text-white hover:bg-yellow-600 font-bold text-lg">-</button>
          <button (click)="increaseQuantity(i)" class="px-2 py-1 rounded bg-green-700 text-white hover:bg-green-600 font-bold text-lg">+</button>
          <button (click)="removeItem(i)" class="px-2 py-1 rounded bg-red-700 text-white hover:bg-red-600 font-bold text-lg">&times;</button>
        </div>
      </div>
      <div *ngIf="items.length === 0" class="text-gray-400 text-center py-8">Nessun oggetto nella borsa.</div>
    </div>
    <div class="mt-4 border-t border-yellow-700 pt-4">
      <div class="flex gap-2 items-end">
        <input [(ngModel)]="newItemName" type="text" placeholder="Nome oggetto" class="flex-1 px-3 py-2 rounded-lg bg-gray-800 text-white border border-gray-700 focus:border-yellow-400 outline-none" />
        <input [(ngModel)]="newItemQuantity" type="number" min="1" class="w-20 px-3 py-2 rounded-lg bg-gray-800 text-white border border-gray-700 focus:border-yellow-400 outline-none" />
        <button (click)="addItem()" class="px-4 py-2 rounded-lg bg-green-600 text-white font-bold hover:bg-green-500 transition">Aggiungi</button>
      </div>
    </div>
    <!-- Monete -->
    <div class="mt-6 flex flex-row items-center justify-end gap-6">
      <div class="flex items-center gap-2">
        <span class="inline-block w-4 h-4 rounded-full bg-yellow-400 border border-yellow-600"></span>
        <span class="text-yellow-300 font-bold text-lg">{{ gold }}</span>
        <span class="text-gray-300 text-sm">Oro</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-4 h-4 rounded-full bg-gray-300 border border-gray-400"></span>
        <span class="text-gray-300 font-bold text-lg">{{ silver }}</span>
        <span class="text-gray-300 text-sm">Argento</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-4 h-4 rounded-full bg-orange-700 border border-orange-900"></span>
        <span class="text-orange-400 font-bold text-lg">{{ copper }}</span>
        <span class="text-gray-300 text-sm">Rame</span>
      </div>
      <button (click)="openCoins.emit()" class="ml-4 px-4 py-2 rounded-lg bg-yellow-700 text-white font-bold hover:bg-yellow-600 transition">Gestisci monete</button>
    </div>
  </div>
</div>
