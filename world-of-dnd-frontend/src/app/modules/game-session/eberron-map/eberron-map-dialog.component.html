<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div
        class="bg-zinc-900 text-zinc-50 rounded-2xl shadow-2xl border-4 border-yellow-700 h-full w-full p-0 flex flex-col relative">
        <!-- Close button -->
        <button (click)="onClose()" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 text-2xl font-bold"
            style="z-index: 9999;">&times;</button>

        <!-- Header (copied structure from original page) -->
        <header class="w-full px-4 py-3 border-b border-white/10 bg-zinc-900/60 backdrop-blur" style="z-index: 999;">
            <div class="mx-auto max-w-screen-xl flex items-center gap-3">
                <div class="size-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <h1 class="text-lg md:text-xl font-semibold tracking-tight">Eberron — Interactive Map</h1>
                <div class="ms-auto flex items-center gap-2">
                    <!-- Menu Disegna -->
                    <div class="relative group" style="z-index:100">
                        <button id="toggleDrawMenu"
                            class="px-3 py-1.5 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition text-sm cursor-pointer flex items-center gap-1">
                            <span id="drawMenuText">Disegna</span>
                            <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div id="drawMenuDropdown"
                            class="hidden group-hover:block absolute left-0 mt-2 min-w-[200px] rounded-xl border border-white/15 bg-zinc-900/95 shadow-lg py-1">
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm draw-tool-btn"
                                data-draw-type="polyline">📏 Linea</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm draw-tool-btn"
                                data-draw-type="polygon">⬟ Poligono</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm draw-tool-btn"
                                data-draw-type="rectangle">▭ Rettangolo</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm draw-tool-btn"
                                data-draw-type="circle">⭕ Cerchio</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm draw-tool-btn"
                                data-draw-type="marker">📍 Marker</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm draw-tool-btn"
                                data-draw-type="circlemarker">⚫ Marker Circolare</button>
                            <div class="border-t border-white/10 my-1"></div>
                            <div class="px-4 py-2">
                                <label class="text-xs text-zinc-400 block mb-1">Colore:</label>
                                <input type="color" id="drawColorPicker" value="#3388ff"
                                    class="w-full h-8 rounded cursor-pointer">
                            </div>
                        </div>
                    </div>

                    <!-- Menu Layer -->
                    <div class="relative" style="z-index:100">
                        <button id="toggleLayerMenu"
                            class="px-3 py-1.5 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition text-sm cursor-pointer flex items-center gap-1">
                            <span>🎨 Layer</span>
                            <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>

                        <div id="layerMenuDropdown"
                            class="hidden absolute left-0 mt-2 min-w-[300px] max-h-[400px] overflow-y-auto rounded-xl border border-white/15 bg-zinc-900/95 shadow-lg py-1">

                            <div *ngFor="let layer of getLayerStates()" class="border-b border-white/5 last:border-0">
                                <!-- Toggle visibilità e info layer -->
                                <div class="px-4 py-2 hover:bg-zinc-800 transition flex items-center gap-2">

                                    <input type="checkbox" [checked]="layer.visible"
                                        (change)="toggleLayerVisibility(layer.color)" class="w-4 h-4 cursor-pointer">

                                    <div class="w-6 h-6 rounded border-2 border-white/30"
                                        [style.backgroundColor]="layer.color"></div>

                                    <span class="flex-1 text-sm font-mono">
                                        {{ layer.name || layer.color }}
                                    </span>

                                    <span class="text-xs text-zinc-400">({{ layer.itemCount }})</span>

                                    <!-- Bottone elimina -->
                                    <button (click)="deleteLayer(layer.color); $event.stopPropagation()"
                                        class="p-1 hover:bg-red-600/20 rounded transition text-red-400 hover:text-red-300"
                                        title="Elimina layer">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                                            viewBox="0 0 24 24">
                                            <path
                                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                    </button>
                                </div>

                                <!-- Campo rinomina -->
                                <div class="px-4 pb-2">
                                    <input type="text" [value]="layer.name || ''"
                                        (blur)="renameLayer(layer.color, $any($event.target).value)"
                                        (keyup.enter)="$any($event.target).blur()" placeholder="Nome layer (opzionale)"
                                        class="w-full px-2 py-1 text-xs rounded bg-zinc-800 border border-white/10 focus:border-emerald-500 focus:outline-none"
                                        (click)="$event.stopPropagation()">
                                </div>
                            </div>

                            <div *ngIf="getLayerStates().length === 0"
                                class="px-4 py-2 text-sm text-zinc-400 text-center">
                                Nessun layer disponibile
                            </div>
                        </div>
                    </div>

                    <!-- Menu Marker -->
                    <div class="relative group" style="z-index:100">
                        <button id="toggleMarkerMenu"
                            class="px-3 py-1.5 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition text-sm cursor-pointer flex items-center gap-1">
                            <span id="markerMenuText">Aggiungi marker</span>
                            <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div id="markerMenuDropdown"
                            class="hidden group-hover:block absolute left-0 mt-2 min-w-[180px] rounded-xl border border-white/15 bg-zinc-900/95 shadow-lg py-1">
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm marker-type-btn"
                                data-marker-type="city">🏙️ Città</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm marker-type-btn"
                                data-marker-type="monster">👾 Posizione Mostro</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm marker-type-btn"
                                data-marker-type="dungeon">🏰 Dungeon</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm marker-type-btn"
                                data-marker-type="village">🏡 Villaggio</button>
                            <button
                                class="w-full text-left px-4 py-2 hover:bg-zinc-800 transition text-sm marker-type-btn"
                                data-marker-type="other">📍 Altro</button>
                        </div>
                    </div>
                    <button id="resetView"
                        class="px-3 py-1.5 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition text-sm cursor-pointer"
                        style="position: relative; z-index: 100;">Reset view</button>
                    <button id="toggleGrid"
                        class="px-3 py-1.5 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition text-sm cursor-pointer"
                        style="position: relative; z-index: 100;">Toggle grid</button>
                </div>
            </div>
        </header>

        <!-- Map area and HUD/help (copied structure) -->
        <main class="relative h-full">
            <div id="map" class="absolute inset-0"></div>

            <div class="pointer-events-none absolute left-3 bottom-3 hidden md:block" style="z-index: 1000;">
                <div
                    class="inline-flex items-center gap-3 rounded-xl border border-white/10 bg-zinc-900/70 backdrop-blur px-3 py-2 text-xs md:text-sm">
                    <div id="hudZoom" class="font-medium tabular-nums">z —</div>
                    <div class="h-3 w-px bg-white/15"></div>
                    <div id="hudTile" class="font-medium tabular-nums">x —, y —</div>
                </div>
            </div>

            <div class="absolute right-3 bottom-3 max-w-[380px] pointer-events-auto hidden md:block"
                style="z-index: 1000;">
                <div
                    class="rounded-xl border border-white/10 bg-zinc-900/70 backdrop-blur px-4 py-3 text-xs md:text-sm leading-relaxed">
                    <p class="opacity-90">
                        <strong>Modalità marker:</strong> Clicca su "Aggiungi marker" e poi sulla mappa per creare
                        marker personalizzati.
                    </p>
                    <p class="mt-2 opacity-80">
                        Sorgente tile: <code
                            class="px-1 py-0.5 rounded bg-white/10">eberron/&#123;z&#125;/&#123;x&#125;/&#123;y&#125;.jpg</code>
                    </p>
                </div>
            </div>
        </main>
    </div>
</div>
