<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eberron Minimap</title>
    <link rel="stylesheet" href="assets/leaflet.css" />
    <link rel="stylesheet" href="assets/map.css" />
    <style>
      html,body,#map { height: 100%; margin: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="assets/leaflet.js"></script>
    <script src="assets/leaflet-plugins/leaflet-ruler.min.js"></script>
    <script src="assets/map.js"></script>
    <script>
      // Minimal initialization in case assets/map.js does not auto-init
      (function () {
        if (typeof L === 'undefined') return;
        if (document.getElementById('map').children.length) return;

        const map = L.map('map', {
          center: [0, 0],
          zoom: 2,
          minZoom: 0,
          maxZoom: 7,
          worldCopyJump: false,
          crs: L.CRS.Simple
        });

        // Tile layer pointing to copied eberron tiles
        L.tileLayer('/minimap/eberron/{z}/{x}/{y}.png', {
          attribution: '',
          maxZoom: 7,
          tileSize: 256,
          continuousWorld: false,
          noWrap: true
        }).addTo(map);

        // Fit to a reasonable bounds if tiles use simple coordinates
        try {
          // If map.js provides helpers, it will override; this is a safe fallback.
          map.setView([0, 0], 2);
        } catch (e) {
          console.warn('Map init fallback failed', e);
        }
      })();
    </script>
  </body>
</html>
