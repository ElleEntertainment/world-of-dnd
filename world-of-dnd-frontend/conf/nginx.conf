worker_processes  5;

events {
  worker_connections  4096;
}


http {
        server {
            include       mime.types;
            listen 8080;
            server_name localhost;
            root /world-of-dnd-frontend/world-of-dnd-frontend/browser;
            ignore_invalid_headers off;

            location / {
                try_files $uri$args $uri$args/ /index.html;
            }
   }
}
